<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c211f"/>
      <stop offset="1" stop-color="#080a09"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f5" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#f4f6f5" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- macOS 的 icns 不会自动裁角，圆角必须画进图里。185 ≈ 824 × 0.225，接近系统图标的圆度 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- 图案按 1024 坐标系画，再整体缩放进内容区，省得每个坐标都换算一遍 -->
  <g transform="translate(100 100) scale(0.8047)">
    <line x1="512.0" y1="512.0" x2="544.1" y2="245.9" stroke="url(#stroke)" stroke-width="15" stroke-linecap="round"/><line x1="544.1" y1="245.9" x2="482.7" y2="133.6" stroke="url(#stroke)" stroke-width="9" stroke-linecap="round"/><line x1="544.1" y1="245.9" x2="634.7" y2="131.5" stroke="url(#stroke)" stroke-width="9" stroke-linecap="round"/><line x1="512.0" y1="512.0" x2="750.8" y2="347.4" stroke="url(#stroke)" stroke-width="15" stroke-linecap="round"/><line x1="512.0" y1="512.0" x2="723.7" y2="648.7" stroke="url(#stroke)" stroke-width="15" stroke-linecap="round"/><line x1="723.7" y1="648.7" x2="851.5" y2="642.8" stroke="url(#stroke)" stroke-width="9" stroke-linecap="round"/><line x1="723.7" y1="648.7" x2="786.8" y2="780.4" stroke="url(#stroke)" stroke-width="9" stroke-linecap="round"/><line x1="512.0" y1="512.0" x2="553.6" y2="807.1" stroke="url(#stroke)" stroke-width="15" stroke-linecap="round"/><line x1="512.0" y1="512.0" x2="276.1" y2="621.2" stroke="url(#stroke)" stroke-width="15" stroke-linecap="round"/><line x1="276.1" y1="621.2" x2="212.8" y2="732.5" stroke="url(#stroke)" stroke-width="9" stroke-linecap="round"/><line x1="276.1" y1="621.2" x2="131.0" y2="604.3" stroke="url(#stroke)" stroke-width="9" stroke-linecap="round"/><line x1="512.0" y1="512.0" x2="262.3" y2="380.9" stroke="url(#stroke)" stroke-width="15" stroke-linecap="round"/>
    <circle cx="544.1" cy="245.9" r="33" fill="#f4f6f5"/><circle cx="482.7" cy="133.6" r="19" fill="#f4f6f5"/><circle cx="634.7" cy="131.5" r="19" fill="#f4f6f5"/><circle cx="750.8" cy="347.4" r="33" fill="#f4f6f5"/><circle cx="723.7" cy="648.7" r="33" fill="#f4f6f5"/><circle cx="851.5" cy="642.8" r="19" fill="#f4f6f5"/><circle cx="786.8" cy="780.4" r="19" fill="#f4f6f5"/><circle cx="553.6" cy="807.1" r="33" fill="#f4f6f5"/><circle cx="276.1" cy="621.2" r="33" fill="#f4f6f5"/><circle cx="212.8" cy="732.5" r="19" fill="#f4f6f5"/><circle cx="131.0" cy="604.3" r="19" fill="#f4f6f5"/><circle cx="262.3" cy="380.9" r="33" fill="#f4f6f5"/>
